            - generic [ref=e84]: Risk Watch
            - paragraph [ref=e85]:
              - strong [ref=e86]: Risk 1 — The Hormuz blockade escalates or drags on.
              - text: If Iran tightens the blockade or the conflict widens, oil pushes well past $100 and stays there. That would make inflation worse and push bond yields even higher — which would pull money out of stocks and into bonds.
            - paragraph [ref=e87]:
              - strong [ref=e88]: Risk 2 — The bond market loses confidence in US debt.
              - text: The 30-year yield at 5.14% is already a loud signal. If investors start demanding even higher yields to hold long-term US debt — because of deficit concerns or persistent inflation — the price of your existing bonds falls further and borrowing costs rise across the economy.
        - generic [ref=e89]:
          - generic [ref=e90]: What to Watch — Next 7 Days
          - paragraph [ref=e91]:
            - strong [ref=e92]: 1. Any movement on the Strait of Hormuz (ongoing).
            - text: This is the hinge everything else swings on. A diplomatic opening or ceasefire would send oil below $90 quickly. That would ease inflation, allow the Fed to consider rate cuts, and give bonds and stocks room to rally. No resolution means oil stays above $100 and every other problem deepens.
          - paragraph [ref=e93]:
            - strong [ref=e94]: 2. The next inflation data release.
            - text: With oil above $100, the next CPI reading will tell us whether energy costs are bleeding into broader prices. If core inflation — which strips out food and energy — stays elevated, the Fed has no room to move. A surprise drop would be the single most positive event for bond prices right now.
          - paragraph [ref=e95]:
            - strong [ref=e96]: 3. The 30-year Treasury yield staying above or breaking below 5%.
            - text: Watch the 5% level specifically. If the 30-year yield starts climbing toward 5.25% or higher, that is the bond market pricing in a longer period of high inflation and government borrowing. That would put real pressure on stock valuations. A drop back below 5% would signal some relief.
